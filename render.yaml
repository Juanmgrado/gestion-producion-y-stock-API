
databases:
  - name: stock-api-db
    plan: free
    databaseName: stock_api
    user: stock_api_user

services:
  - type: web
    name: stock-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: stock-api-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: stock-api-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: stock-api-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: stock-api-db
          property: password
      - key: DB_DATABASE
        fromDatabase:
          name: stock-api-db
          property: database
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_WHATSAPP_TO
        sync: false